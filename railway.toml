[build]
builder = "DOCKERFILE"

[[services]]
name = "database"
source = "database"
[services.env]
POSTGRES_DB = "laptop_repair"
POSTGRES_USER = "postgres"
[services.env.production]
POSTGRES_PASSWORD = "${{RAILWAY_GENERATED_INSECURE_PASSWORD}}"

[[services]]
name = "app"
[services.env]
SERVER_PORT = "8080"
# Database connection variables
PGHOST = "${{database.RAILWAY_PRIVATE_DOMAIN}}"
PGPORT = "5432"
PGDATABASE = "${{database.POSTGRES_DB}}"
PGUSER = "postgres"
PGPASSWORD = "${{database.POSTGRES_PASSWORD}}"
[services.env.production]
OPENAI_API_KEY = "${OPENAI_API_KEY}"
SENDGRID_API_KEY = "${SENDGRID_API_KEY}"
APP_SECURITY_STAFF_USERS = "${APP_SECURITY_STAFF_USERS}"
APP_EMAIL_FROM = "${APP_EMAIL_FROM}"
APP_EMAIL_CC = "${APP_EMAIL_CC}"
APP_SHOP_NAME = "${APP_SHOP_NAME}"
