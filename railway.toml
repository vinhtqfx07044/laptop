[build]
builder = "DOCKERFILE"

[[services]]
name = "app"
start = "java $JAVA_OPTS -Dserver.port=${PORT} -jar app.jar"

[services.env]
# Railway sẽ dùng PORT cho routing, nhưng đặt default để chạy local preview
PORT = "8080"

# Cấu hình Database đã có sẵn
PGHOST = "${{PGHOST}}"
PGPORT = "${{PGPORT}}"
PGDATABASE = "${{PGDATABASE}}"
PGUSER = "${{PGUSER}}"
PGPASSWORD = "${{PGPASSWORD}}"

# Các secrets khác
OPENAI_API_KEY = "${{OPENAI_API_KEY}}"
SENDGRID_API_KEY = "${{SENDGRID_API_KEY}}"
APP_SECURITY_STAFF_USERS = "${{APP_SECURITY_STAFF_USERS}}"
APP_EMAIL_FROM = "${{APP_EMAIL_FROM}}"
APP_EMAIL_CC = "${{APP_EMAIL_CC}}"
APP_SHOP_NAME = "${{APP_SHOP_NAME}}"
PUBLIC_BASE_URL = "${{PUBLIC_BASE_URL}}"