# ===================================================================
# MINIMAL TEST CONFIGURATION
# ===================================================================
server.port=0
spring.main.banner-mode=off

# ===================================================================
# DATABASE CONFIGURATION (H2 IN-MEMORY)
# ===================================================================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===================================================================
# JPA/HIBERNATE CONFIGURATION (TEST)
# ===================================================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# ===================================================================
# DISABLE EXTERNAL DEPENDENCIES FOR UNIT TESTS
# ===================================================================
spring.autoconfigure.exclude=\
  org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration,\
  org.springframework.ai.autoconfigure.openai.OpenAiChatAutoConfiguration,\
  org.springframework.ai.autoconfigure.openai.OpenAiEmbeddingAutoConfiguration,\
  org.springframework.ai.autoconfigure.vectorstore.pgvector.PgVectorStoreAutoConfiguration,\
  org.springframework.ai.autoconfigure.chat.memory.ChatMemoryAutoConfiguration

# ===================================================================
# LOGGING
# ===================================================================
logging.level.org.springframework=WARN
logging.level.com.laptoprepair=INFO
