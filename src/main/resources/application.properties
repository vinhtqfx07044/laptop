# ===================================================================
# WEB CONFIGURATION
# ===================================================================
server.port=${SERVER_PORT:8080}

# UTF-8 encoding support
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Tomcat URI encoding
server.tomcat.uri-encoding=UTF-8
server.tomcat.relaxed-query-chars=|,{,},[,],

# Session configuration
server.servlet.session.timeout=30m
server.servlet.session.cookie.max-age=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.persistent=true

# File upload configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=52MB

# ===================================================================
# DATABASE CONFIGURATION (POSTGRESQL)
# ===================================================================
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.sql.init.mode=never

# ===================================================================
# AI CONFIGURATION
# ===================================================================
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.model=${OPENAI_CHAT_MODEL:gpt-oss-120b}
spring.ai.openai.chat.options.temperature=0.7
spring.ai.openai.embedding.model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
spring.ai.chat.memory.repository.jdbc.initialize-schema=never
laptoprepair.ai.chat.max-user-messages=${APP_CHAT_MAX_MESSAGES:10}
laptoprepair.ai.chat.system-prompt-file=classpath:system-prompt.txt
laptoprepair.ai.search.document.similarity-threshold=${APP_SEARCH_DOCUMENT_SIMILARITY_THRESHOLD:0.6}
laptoprepair.ai.search.document.top-k=${APP_SEARCH_DOCUMENT_TOP_K:5}

# ===================================================================
# SECURITY CONFIGURATION
# ===================================================================
laptoprepair.security.staff-users=${APP_SECURITY_STAFF_USERS:staff:staff123,admin:admin123,manager:manager123}
laptoprepair.security.rate-limit.public.requests-per-minute=${APP_RATE_LIMITER_PUBLIC_RPM:10}
laptoprepair.security.rate-limit.chat.requests-per-minute=${APP_RATE_LIMITER_CHAT_RPM:5}

# ===================================================================
# BUSINESS CONFIGURATION (CUSTOM PROPERTIES)
# ===================================================================
laptoprepair.business.shop.name=${APP_SHOP_NAME:Laptop Repair Shop}
laptoprepair.business.shop.public-request-base-url=${PUBLIC_BASE_URL:http://localhost:8080}/public/request/

# ===================================================================
# NOTIFICATION CONFIGURATION (CUSTOM PROPERTIES)
# ===================================================================
laptoprepair.notification.email.sendgrid.api-key=${SENDGRID_API_KEY}
laptoprepair.notification.email.from=${APP_EMAIL_FROM:noreply@localhost}
laptoprepair.notification.email.cc=${APP_EMAIL_CC:}

# ===================================================================
# MONITORING AND LOGGING CONFIGURATION
# ===================================================================
logging.file.name=logs/application.log
logging.level.com.laptoprepair=DEBUG
logging.level.org.springframework=INFO
logging.level.org.springframework.security=DEBUG
logging.level.com.laptoprepair.exception.GlobalExceptionHandler=INFO
logging.level.com.laptoprepair.controller=DEBUG